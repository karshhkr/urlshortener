spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/url_shortener?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=DevPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

logging.level.com.urlshortener=DEBUG
logging.level.org.hibernate.SQL=DEBUG

app.cache.ttl-seconds=60
app.cache.max-size=100

# Local-only fallback so the app starts on your laptop. NEVER used in prod.
app.jwt.secret=${JWT_SECRET:dev-only-secret-not-for-production-0123456789abcdef}