spring.datasource.url=${DB_URL}
spring.datasource.username=${root}
spring.datasource.password=${12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=${PORT:8080}

spring.datasource.hikari.pool-name=ProdPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# TEMPORARY: prod tables were originally created by Hibernate, so their exact shape is
# unverified. Keep "update" for the first deploy of this version. After you confirm
# (DESCRIBE url_mappings) that created_by and updated_at exist, switch to "validate".
spring.jpa.hibernate.ddl-auto=update

logging.level.com.urlshortener=INFO
logging.file.name=/tmp/app.log
logging.level.root=INFO

app.cache.ttl-seconds=3600
app.cache.max-size=10000
management.endpoints.web.exposure.include=health,info