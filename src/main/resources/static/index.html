<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>URL Shortener - Login</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<h1>URL Shortener</h1>
<p class="subtitle">Login or create an account to continue</p>

<div class="card narrow">
    <div class="tabs">
        <button id="tabLogin" class="active">Login</button>
        <button id="tabRegister">Register</button>
    </div>

    <input id="username" placeholder="Username or email" autocomplete="username" />
    <input id="email" class="hidden" type="email" placeholder="Email" autocomplete="email" />
    <input id="password" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password" />
    <button id="submitBtn" class="full">Login</button>
    <div id="authMessage" class="message"></div>
</div>

<p class="footer">Built with Spring Boot + MySQL</p>

<script src="common.js"></script>
<script>
    // Already logged in? Go straight to the app.
    if (getToken()) location.replace('app.html');

    let mode = 'login';

    function setMode(m) {
      mode = m;
      $('tabLogin').classList.toggle('active', m === 'login');
      $('tabRegister').classList.toggle('active', m === 'register');
      $('email').classList.toggle('hidden', m === 'login');
      $('username').placeholder = m === 'login' ? 'Username or email' : 'Choose a username';
      $('submitBtn').textContent = m === 'login' ? 'Login' : 'Create account';
      clearMsg($('authMessage'));
    }

    async function submit() {
      const msg = $('authMessage'); clearMsg(msg);
      const username = $('username').value.trim();
      const password = $('password').value;
      const email = $('email').value.trim();

      if (!username || !password) { show(msg, 'error', 'Please fill in all fields.'); return; }
      if (mode === 'register' && !email) { show(msg, 'error', 'Please enter your email.'); return; }

      const body = { username, password };
      if (mode === 'register') body.email = email;

      $('submitBtn').disabled = true;
      const r = await api('/api/auth/' + mode, { method: 'POST', body: JSON.stringify(body) });
      $('submitBtn').disabled = false;

      if (!r.ok) { show(msg, 'error', errText(r)); return; }
      saveSession(r.data);
      location.href = 'app.html';
    }

    $('tabLogin').onclick = () => setMode('login');
    $('tabRegister').onclick = () => setMode('register');
    $('submitBtn').onclick = submit;
    $('password').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
