spring.application.name=urlshortener

# Active profile (override in each environment)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# JPA: Flyway owns the schema, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Existing databases (created before Flyway was enabled) are baselined at version 0,
# so V1/V2 (CREATE TABLE IF NOT EXISTS) run harmlessly and V3+ apply normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# App custom config
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.short-code-length=6
app.default-expiry-days=365
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# JWT: NO default here on purpose. The app refuses to start without JWT_SECRET
# (the dev profile provides a local-only fallback). Minimum 32 characters.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000